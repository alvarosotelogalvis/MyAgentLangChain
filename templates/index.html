<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Multi-LLM Agent – Interlan</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 720px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #fff;
      box-shadow: 0 2px 20px rgba(0,0,0,0.1);
    }

    header {
      padding: 10px 20px;
      background: #1a1a2e;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .header-logo {
      height: 36px;
      width: auto;
      object-fit: contain;
      flex-shrink: 0;
    }

    .header-divider {
      width: 1px;
      height: 28px;
      background: rgba(255,255,255,0.25);
      flex-shrink: 0;
    }

    .header-title {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    header h1 { font-size: 1rem; font-weight: 600; }

    .security-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.7rem;
      color: #4ade80;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .security-badge svg {
      width: 12px;
      height: 12px;
      fill: #4ade80;
    }

    select {
      background: #2a2a4e;
      color: #fff;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.85rem;
      cursor: pointer;
      flex-shrink: 0;
    }

    .creator {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .creator-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255,255,255,0.35);
      flex-shrink: 0;
    }

    .creator-info {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .creator-label {
      font-size: 0.65rem;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .creator-name {
      font-size: 0.8rem;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: 16px;
      line-height: 1.5;
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.user {
      align-self: flex-end;
      background: #1a1a2e;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .msg.bot {
      align-self: flex-start;
      background: #f0f2f5;
      color: #1a1a2e;
      border-bottom-left-radius: 4px;
    }

    .msg.error {
      align-self: center;
      background: #fde8e8;
      color: #c0392b;
      font-size: 0.85rem;
    }

    .typing {
      align-self: flex-start;
      background: #f0f2f5;
      border-radius: 16px;
      border-bottom-left-radius: 4px;
      padding: 12px 16px;
      display: flex;
      gap: 5px;
    }

    .typing span {
      width: 8px; height: 8px;
      background: #999;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-6px); }
    }

    footer {
      padding: 16px;
      border-top: 1px solid #e5e7eb;
      display: flex;
      gap: 10px;
    }

    #input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #d1d5db;
      border-radius: 24px;
      font-size: 0.95rem;
      outline: none;
      resize: none;
      max-height: 120px;
      line-height: 1.4;
    }

    #input:focus { border-color: #1a1a2e; }

    button {
      padding: 10px 20px;
      background: #1a1a2e;
      color: #fff;
      border: none;
      border-radius: 24px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    button:hover { background: #2a2a4e; }
    button:disabled { background: #9ca3af; cursor: not-allowed; }
  </style>
</head>
<body>
<div class="container">
  <header>
    <img
      class="header-logo"
      src="https://www.interlan.com.co/wp-content/uploads/2023/03/logo-interlan-web@3x-8.png"
      alt="Interlan"
    />
    <div class="header-divider"></div>
    <div class="header-title">
      <h1>Multi-LLM Agent</h1>
      <div class="security-badge">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/>
        </svg>
        Protegido con TrendAI -> AI Scanner
      </div>
    </div>
    <select id="provider">
      <option value="gemini">Gemini</option>
      <option value="openai">OpenAI</option>
      <option value="anthropic">Anthropic</option>
    </select>

    <div class="creator">
      <img
        class="creator-avatar"
        src="https://media.licdn.com/dms/image/v2/D4E03AQFvGHKf5uKh3g/profile-displayphoto-shrink_200_200/profile-displayphoto-shrink_200_200/0/1683514895920?e=2147483647&v=beta&t=m0zNTsNnKwHx-1EXx7M7fKJ0lgogU1w2VcFSmZJwNCg"
        alt="Álvaro Sotelo"
      />
      <div class="creator-info">
        <span class="creator-name">Alvaro Sotelo</span>
        <span class="creator-label">alvarosg@interlan.com.co</span>
      </div>
    </div>
  </header>

  <div id="messages"></div>

  <footer>
    <textarea id="input" rows="1" placeholder="Escribe un mensaje..."></textarea>
    <button id="sendBtn" onclick="sendMessage()">Enviar</button>
  </footer>
</div>

<script>
  const sessionId = "session-" + Math.random().toString(36).slice(2, 9);
  const messagesEl = document.getElementById("messages");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("sendBtn");

  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  function addMessage(text, role) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function showTyping() {
    const div = document.createElement("div");
    div.className = "typing";
    div.id = "typing";
    div.innerHTML = "<span></span><span></span><span></span>";
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTyping() {
    document.getElementById("typing")?.remove();
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    const provider = document.getElementById("provider").value;

    addMessage(text, "user");
    inputEl.value = "";
    sendBtn.disabled = true;
    showTyping();

    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, provider, session_id: sessionId }),
      });
      const data = await res.json();
      removeTyping();
      if (res.ok) {
        addMessage(data.response, "bot");
      } else {
        addMessage("Error: " + data.error, "error");
      }
    } catch {
      removeTyping();
      addMessage("No se pudo conectar con el servidor.", "error");
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }
</script>
</body>
</html>
